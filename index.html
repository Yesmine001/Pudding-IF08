<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recette de pudding</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS personnalisé -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="container my-5">
    <h1 class="text-center mb-4">Recette de pudding</h1>

    <section id="recipe-description" class="mb-4">
      <h2>Description</h2>
      <p>Cette section affichera la description de la recette.</p>
    </section>

    <section id="ingredients" class="mb-4">
      <h2>Ingrédients</h2>
      <div id="products-list" class="row"></div>
    </section>

    <section id="steps" class="mb-4">
      <h2>Étapes de préparation</h2>
      <ol id="steps-list"></ol>
    </section>

    <section id="nutrition-score" class="mb-4">
      <h2>Score nutritionnel moyen</h2>
      <p id="average-score">En attente du calcul...</p>
    </section>
  </main>

  <!-- JavaScript personnalisé -->
  <script src="js/main.js"></script>
</body>
</html>
